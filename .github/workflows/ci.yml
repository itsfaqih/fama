name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - run: vp run setup
      - run: vp exec playwright install-deps chromium
      - run: vp run lint
      - run: vp run test
      - run: vp run test:components
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: component-artifacts
          path: component-artifacts/
          if-no-files-found: ignore
      - run: vp run test:site
